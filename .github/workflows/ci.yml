name: 🦀 Rust CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: 🧪 Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]
        exclude:
          # Only run beta on Ubuntu to save CI time
          - os: windows-latest
            rust: beta
          - os: macos-latest
            rust: beta

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🦀 Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}

    - name: 💾 Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: 💾 Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

    - name: 💾 Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: 🔨 Build
      run: cargo build --verbose --all-features

    - name: 🧪 Run tests
      run: cargo test --verbose --all-features

    - name: 🔨 Build release
      run: cargo build --release --verbose --all-features

  lint:
    name: 🔍 Lint & Format
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🦀 Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: 💾 Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}

    - name: 📝 Check formatting
      run: cargo fmt -- --check

    - name: 📎 Run Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

  coverage:
    name: 📊 Code Coverage
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🦀 Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: 🔧 Install tarpaulin
      run: cargo install cargo-tarpaulin

    - name: 💾 Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}

    - name: 📊 Generate coverage
      run: cargo tarpaulin --verbose --all-features --workspace --timeout 120 --out Xml

    - name: 📤 Upload to codecov.io
      uses: codecov/codecov-action@v4
      with:
        fail_ci_if_error: false

  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🦀 Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: 🔒 Run cargo audit
      uses: rustsec/audit-check@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    name: 🏗️ Build Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: todo-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: todo-windows-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: todo-macos-x86_64

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🦀 Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: 💾 Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

    - name: 🏗️ Build release binaries
      run: cargo build --release --target ${{ matrix.target }}

    - name: 📦 Prepare artifacts (Unix)
      if: runner.os != 'Windows'
      run: |
        mkdir -p artifacts
        cp target/${{ matrix.target }}/release/todo-tui artifacts/
        cp target/${{ matrix.target }}/release/todo-cli artifacts/
        cp target/${{ matrix.target }}/release/todo-server artifacts/
        cp target/${{ matrix.target }}/release/seed-todos artifacts/
        tar -czf ${{ matrix.artifact_name }}.tar.gz -C artifacts .

    - name: 📦 Prepare artifacts (Windows)
      if: runner.os == 'Windows'
      run: |
        mkdir artifacts
        cp target/${{ matrix.target }}/release/todo-tui.exe artifacts/
        cp target/${{ matrix.target }}/release/todo-cli.exe artifacts/
        cp target/${{ matrix.target }}/release/todo-server.exe artifacts/
        cp target/${{ matrix.target }}/release/seed-todos.exe artifacts/
        Compress-Archive -Path artifacts/* -DestinationPath ${{ matrix.artifact_name }}.zip

    - name: 📤 Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          ${{ matrix.artifact_name }}.tar.gz
          ${{ matrix.artifact_name }}.zip
        if-no-files-found: ignore

  docs:
    name: 📚 Build Documentation
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🦀 Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: 💾 Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}

    - name: 📚 Build documentation
      run: cargo doc --no-deps --all-features

    - name: 📤 Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: target/doc

  # Summary job that depends on all other jobs
  ci-success:
    name: ✅ CI Success
    runs-on: ubuntu-latest
    needs: [test, lint, security, binaries, docs]
    if: always()

    steps:
    - name: ✅ Check all jobs
      run: |
        if [[ "${{ needs.test.result }}" != "success" ]] || \
           [[ "${{ needs.lint.result }}" != "success" ]] || \
           [[ "${{ needs.security.result }}" != "success" ]] || \
           [[ "${{ needs.binaries.result }}" != "success" ]] || \
           [[ "${{ needs.docs.result }}" != "success" ]]; then
          echo "❌ One or more CI jobs failed!"
          exit 1
        fi
        echo "✅ All CI jobs passed successfully!"

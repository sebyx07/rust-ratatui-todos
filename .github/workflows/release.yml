name: 🚀 Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  create-release:
    name: 📝 Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: 📋 Generate changelog
        id: changelog
        run: |
          {
            echo "## What's Changed"
            echo ""
            git log $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD --pretty=format:"- %s (%h)" || echo "- Initial release"
          } > changelog.md

      - name: 🎉 Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v${{ steps.get_version.outputs.version }} \
            --title "Release v${{ steps.get_version.outputs.version }}" \
            --notes-file changelog.md

  build-release:
    name: 🏗️ Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: todo-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: todo-windows-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: todo-macos-x86_64

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🦀 Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: 💾 Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: 🏗️ Build release binaries
        run: cargo build --release --all-features

      - name: 📦 Prepare artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p release
          cp target/release/todo-tui release/
          cp target/release/todo-cli release/
          cp target/release/todo-server release/
          cp target/release/seed-todos release/
          cp README.md LICENSE release/
          cd release
          tar czf ../${{ matrix.artifact_name }}.tar.gz *

      - name: 📦 Prepare artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir release
          copy target\release\todo-tui.exe release\
          copy target\release\todo-cli.exe release\
          copy target\release\todo-server.exe release\
          copy target\release\seed-todos.exe release\
          copy README.md release\
          copy LICENSE release\
          cd release
          tar.exe -czf ..\${{ matrix.artifact_name }}.tar.gz *

      - name: 📤 Upload Release Asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v${{ needs.create-release.outputs.version }} ${{ matrix.artifact_name }}.tar.gz --clobber

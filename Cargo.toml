[package]
name = "rust-ratatui-todo"
version = "0.1.0"
edition = "2024"
authors = ["sebyx07"]
description = "A high-performance todo list application with TUI, CLI, and REST API interfaces"
readme = "README.md"
homepage = "https://github.com/sebyx07/rust-ratatui-todos"
repository = "https://github.com/sebyx07/rust-ratatui-todos"
license = "MIT"
keywords = ["todo", "tui", "cli", "rest-api", "sqlite"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "todo-tui"
path = "src/main.rs"

[[bin]]
name = "todo-server"
path = "src/bin/server.rs"

[[bin]]
name = "todo-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "seed-todos"
path = "src/bin/seed.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
tower-http = { version = "0.5", features = ["cors"] }
clap = { version = "4.5", features = ["derive", "env"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"
